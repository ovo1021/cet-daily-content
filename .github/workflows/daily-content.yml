name: Daily Content 每日内容生成

on:
  schedule:
    # 每天 16:10 UTC = 次日 00:10 北京时间
    - cron: "10 16 * * *"
  workflow_dispatch: # 支持手动"Run workflow"

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成当日内容
        run: node scripts/generate-daily.js

      - name: 提交并推送（当天内容）
        run: |
          git config user.name "cet-daily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/
          if git diff --cached --quiet; then
            echo "今天内容已存在，无需更新"
          else
            git commit -m "docs(daily): 生成当日内容 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi
